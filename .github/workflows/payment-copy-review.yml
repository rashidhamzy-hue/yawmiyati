name: Review payment copy
on: pull_request
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git grep -ilE 'الدفع|الاستلام|نقد[ايً]|كاش|cash.on.delivery|cash.only|بطاق|prepaid|credit.card|apple.pay|mada' -- src scripts supabase/functions public | grep -vE '\.(svg|lock|map)$' || true
