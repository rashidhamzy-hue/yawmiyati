# Proves the deployed storefront reports browser errors to Sentry (org yawmiyati,
# project yawmiyati-storefront). Manual only: each run sends ONE clearly labelled
# test error from staging, then checks Sentry's ingest endpoint accepted it.
name: Sentry smoke (staging)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser (outside the repo, which is a bun project)
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null
          npm install playwright@1.58.2 && npx playwright install --with-deps chromium
      - name: Send one test error from staging
        env:
          BASE: https://yawmiyati-storefront-staging.rashid-hamzy.workers.dev
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/sentry-smoke.cjs
