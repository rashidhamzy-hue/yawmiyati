# Deploys the Yawmiyati Brain edge function to the Yawmiyati Supabase project
# (staging ref skhtunkknshvolturqlm) after its code reaches main.
# Needs the repository secret SUPABASE_ACCESS_TOKEN (a Supabase personal access
# token from the Yawmiyati owner account). Without it the job only prints a notice.
name: Deploy Yawmiyati Brain
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/functions/yawmiyati-brain/**', 'supabase/functions/_shared/brain/**', '.github/workflows/deploy-brain.yml']
permissions:
  contents: read
concurrency:
  group: deploy-brain
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check token
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN is not set; brain function not deployed."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: denoland/setup-deno@v2
        if: steps.token.outputs.ok == 'true'
        with: { deno-version: v2.x }
      - name: Type-check
        if: steps.token.outputs.ok == 'true'
        run: deno check --no-lock supabase/functions/yawmiyati-brain/index.ts
      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.ok == 'true'
        with: { version: latest }
      - name: Deploy
        if: steps.token.outputs.ok == 'true'
        run: supabase functions deploy yawmiyati-brain --project-ref skhtunkknshvolturqlm --use-api
