# Deploys the Yawmiyati Brain edge function to the Yawmiyati Supabase project
# (staging ref skhtunkknshvolturqlm) after its code reaches main.
# Needs the repository secret SUPABASE_ACCESS_TOKEN (a Supabase personal access
# token from the Yawmiyati owner account). Without it the job only prints a notice.
name: Deploy Yawmiyati Brain
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/functions/yawmiyati-brain/**', 'supabase/functions/_shared/brain/**', 'supabase/functions/yawmiyati-daily/**', 'supabase/functions/_shared/learn/**', 'supabase/functions/yawmiyati-whatsapp/**', 'supabase/functions/yawmiyati-shopping-assistant/**', 'supabase/functions/_shared/assistant/**', '.github/workflows/deploy-brain.yml']
permissions:
  contents: read
concurrency:
  group: deploy-brain
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check token
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN is not set; brain function not deployed."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: denoland/setup-deno@v2
        if: steps.token.outputs.ok == 'true'
        with: { deno-version: v2.x }
      - name: Type-check
        if: steps.token.outputs.ok == 'true'
        run: deno check --no-lock supabase/functions/yawmiyati-brain/index.ts supabase/functions/yawmiyati-shopping-assistant/index.ts supabase/functions/yawmiyati-daily/index.ts supabase/functions/yawmiyati-whatsapp/index.ts
      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.ok == 'true'
        with: { version: latest }
      - name: Deploy
        if: steps.token.outputs.ok == 'true'
        run: supabase functions deploy yawmiyati-brain --project-ref skhtunkknshvolturqlm --use-api --yes
      # The shopping assistant's paid answers stay off after a deploy: they need the server secret, the market's
      # budget row and the public flag, all owner decisions.
      - name: Deploy shopping assistant
        if: steps.token.outputs.ok == 'true'
        run: supabase functions deploy yawmiyati-shopping-assistant --project-ref skhtunkknshvolturqlm --use-api --yes
      # The daily loop is called by the database scheduler (no user): JWT verification is off and the function checks
      # the scheduler's secret or the owner's session itself. It does nothing until its secrets exist.
      - name: Deploy daily loop
        if: steps.token.outputs.ok == 'true'
        run: supabase functions deploy yawmiyati-daily --project-ref skhtunkknshvolturqlm --use-api --no-verify-jwt --yes
      # The WhatsApp assistant's webhook: Meta calls it, so JWT verification is off; it checks Meta's signature itself and
      # stays silent until the owner sets WHATSAPP_ENABLED=true and the number's secrets.
      - name: Deploy WhatsApp assistant
        if: steps.token.outputs.ok == 'true'
        run: supabase functions deploy yawmiyati-whatsapp --project-ref skhtunkknshvolturqlm --use-api --no-verify-jwt --yes
