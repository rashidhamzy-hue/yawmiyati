# Lighthouse audit of the deployed staging storefront (mobile, all five markets).
# Read-only: it only loads public staging pages. Results are uploaded as an artifact
# and summarised in the job log.
name: Lighthouse staging audit
on:
  workflow_dispatch:
  push:
    branches: [qa/lighthouse-staging, 'perf/**']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE: https://yawmiyati-storefront-staging.rashid-hamzy.workers.dev
    steps:
      - name: Run Lighthouse (mobile)
        run: |
          set -u
          mkdir -p lh
          # The store chooser, then home, a section page and the cart in every market, plus search, a policy page and the story once.
          pages="?choose=1 sa/search sa/info/shipping-returns sa/story"
          for m in sa ae om eg iq; do pages="$pages $m $m/c/kitchen $m/cart"; done
          for p in $pages; do
            name=$(echo "$p" | tr '/?=' '___')
            npx -y lighthouse@12 "$BASE/$p" --quiet --chrome-flags="--headless=new --no-sandbox" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json --output=html --output-path="lh/$name" || echo "FAILED $p"
          done
      - uses: actions/checkout@v4
        with:
          path: repo
      - name: Summary
        run: node repo/scripts/lighthouse-summary.mjs lh/*.report.json
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse-staging
          path: lh/
