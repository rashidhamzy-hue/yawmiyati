name: Commerce checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      # TanStack Router generates routeTree.gen.ts during build.
      - run: node scripts/check-simulation-boundary.mjs
      - run: node scripts/check-storefront-truth.mjs
      - run: node scripts/test-storefront-truth-guard.mjs
      - run: node scripts/check-m4g-release-boundary.mjs
      - run: node scripts/check-m4h-handoff.mjs
      - run: node scripts/check-handoff-manifest.mjs
      - run: node scripts/check-offer-fixture-isolation.mjs
      - run: bun run build
      # The default build must ship no storefront offer fixtures.
      - run: node scripts/check-offer-fixture-isolation.mjs --build .output
      - name: Run unit tests with capture
        shell: bash
        run: |
          bun run test > /tmp/yawmiyati-ci-tests.log 2>&1
          result=$?
          tail -n 110 /tmp/yawmiyati-ci-tests.log
          exit "$result"
      - name: Report failing test diagnostics to PR
        if: ${{ failure() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            if (!fs.existsSync("/tmp/yawmiyati-ci-tests.log")) return;
            const raw=fs.readFileSync("/tmp/yawmiyati-ci-tests.log","utf8");
            const excerpt=raw.slice(-13000).replaceAll("`","ˋ");
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: "Temporary CI diagnostic for storefront polish PR:\\n\\n```text\\n"+excerpt+"\\n```"
            });
