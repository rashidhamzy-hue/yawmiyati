name: Commerce checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      # The Yawmiyati Brain edge function runs on Deno: type-check it as Deno sees it.
      - run: deno check --no-lock supabase/functions/yawmiyati-brain/index.ts
      - run: deno check --no-lock supabase/functions/yawmiyati-shopping-assistant/index.ts
      - run: deno check --no-lock supabase/functions/yawmiyati-daily/index.ts
      # TanStack Router generates routeTree.gen.ts during build.
      - run: node scripts/check-simulation-boundary.mjs
      - run: node scripts/check-storefront-truth.mjs
      - run: node scripts/test-storefront-truth-guard.mjs
      - run: node scripts/check-m4g-release-boundary.mjs
      - run: node scripts/check-m4h-handoff.mjs
      - run: node scripts/check-handoff-manifest.mjs
      - run: node scripts/check-offer-fixture-isolation.mjs
      # One dictionary per market: missing keys, Latin leaks, banned wording, mixed dialect, new hard-coded Arabic.
      - run: bun scripts/check-market-dictionaries.ts
      - run: bun run build
      # The default build must ship no storefront offer fixtures.
      - run: node scripts/check-offer-fixture-isolation.mjs --build .output
      - run: bun run test
