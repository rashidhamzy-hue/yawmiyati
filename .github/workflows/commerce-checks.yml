name: Commerce checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      # TanStack Router generates routeTree.gen.ts during build.
      - run: node scripts/check-simulation-boundary.mjs
      - run: node scripts/check-storefront-truth.mjs
      - run: node scripts/test-storefront-truth-guard.mjs
      - run: node scripts/check-m4g-release-boundary.mjs
      - run: node scripts/check-m4h-handoff.mjs
      - run: node scripts/check-handoff-manifest.mjs
      - run: node scripts/check-offer-fixture-isolation.mjs
      - run: bun run build
      # The default build must ship no storefront offer fixtures.
      - run: node scripts/check-offer-fixture-isolation.mjs --build .output
      - run: bun run test
